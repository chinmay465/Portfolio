name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ank-marathi-epapers/package-lock.json

      - name: Test and build Ank
        working-directory: ank-marathi-epapers
        run: |
          npm ci
          npm test
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/ank-marathi-epapers
          cp -r ank-marathi-epapers/dist/. _site/ank-marathi-epapers/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./ank-marathi-epapers/">
          <title>Chinmay Upare · Portfolio</title>
          <a href="./ank-marathi-epapers/">Ank — Marathi epaper hub</a>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
