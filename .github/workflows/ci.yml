name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  home:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-home/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test
        run: |
          npx vite preview --port 4178 &
          for i in $(seq 1 20); do curl -fs localhost:4178/ > /dev/null && break; sleep 1; done
          curl -fs localhost:4178/ | grep -q '<div id="root">'
          curl -fs localhost:4178/projects/ekatra | grep -q '<div id="root">'
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests against vite preview
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: home-playwright-report
          path: |
            portfolio-home/playwright-report
            portfolio-home/test-results
          retention-days: 7

  ank:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ank-marathi-epapers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ank-marathi-epapers/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke test
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 20); do curl -fs localhost:4173/ > /dev/null && break; sleep 1; done
          curl -fs localhost:4173/ | grep -q '<div id="root">'

  ekatra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ekatra-streaming-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ekatra-streaming-hub/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test
        run: |
          npx vite preview --port 4174 &
          for i in $(seq 1 20); do curl -fs localhost:4174/ > /dev/null && break; sleep 1; done
          curl -fs localhost:4174/ | grep -q '<div id="root">'

  shodh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shodh-paste-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shodh-paste-monitor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test
        run: |
          PORT=4175 npm start &
          for i in $(seq 1 30); do curl -fs localhost:4175/ > /dev/null && break; sleep 1; done
          curl -fs localhost:4175/ | grep -q '<div id="root">'
          curl -fs -X POST localhost:4175/api/start -H 'Content-Type: application/json' \
            -d '{"keywords":["acme"],"sources":[{"type":"mock"}],"intervalMs":2000}' | grep -q '"ok":true'
          curl -fs -X POST localhost:4175/api/stop | grep -q '"ok":true'

  setu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: setu-proxy-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: setu-proxy-hub/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test
        env:
          SETU_NO_REFRESH: "1"
          PORT: "4176"
          SETU_TUNNEL_PORT: "4177"
        run: |
          npm start &
          for i in $(seq 1 30); do curl -fs localhost:4176/ > /dev/null && break; sleep 1; done
          curl -fs localhost:4176/ | grep -q '<div id="root">'
          curl -fs localhost:4176/api/config | grep -q '"tunnel":{"address"'
          curl -fs localhost:4176/api/pool | grep -q '"alive":0'
          curl -s localhost:4176/api/fetch?url=http://example.com | grep -q 'Plain http'

  darshak:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: darshak-visitor-counter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: darshak-visitor-counter/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test
        env:
          PORT: "4180"
          DASHBOARD_TOKEN: ci-token
          ALLOWED_ORIGINS: https://chinmay-upare.onrender.com
          DARSHAK_DATA_DIR: memory://
        run: |
          npm start &
          for i in $(seq 1 30); do curl -fs localhost:4180/api/health > /dev/null && break; sleep 1; done
          curl -fs localhost:4180/ | grep -q '<div id="root">'
          visit() {
            curl -fs -X POST localhost:4180/api/visit -H 'Content-Type: text/plain' \
              -H 'Origin: https://chinmay-upare.onrender.com' -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64) Chrome/131.0' \
              -d '{"id":"3f2b8c1e-6d4a-4b7e-9c2f-1a2b3c4d5e6f","path":"'"$1"'"}'
          }
          visit / | grep -q '"new":true'
          visit /projects | grep -q '"new":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4180/api/stats)" = 401
          curl -fs localhost:4180/api/stats -H 'Authorization: Bearer ci-token' | grep -q '"total":1'

  kavach:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kavach-adblock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug
      - name: Privacy check (permissions, exported components, tracker SDKs, endpoints)
        run: bash scripts/privacy-check.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kavach-debug-apk
          path: kavach-adblock/app/build/outputs/apk/debug/app-debug.apk

  bachat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bachat-offer-alerts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bachat-offer-alerts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test (fixture sources, in-memory database)
        env:
          PORT: "4182"
          BACHAT_FIXTURES: "1"
          BACHAT_DATA_DIR: memory://
        run: |
          npm start &
          for i in $(seq 1 30); do curl -fs localhost:4182/api/health | grep -q '"ok":true' && break; sleep 1; done
          curl -fs localhost:4182/ | grep -q '<div id="root">'
          curl -fs localhost:4182/sw.js | grep -q 'showNotification'
          curl -fs localhost:4182/manifest.webmanifest | grep -q '"display": "standalone"'
          curl -fs localhost:4182/api/config | grep -q '"publicKey":"B'
          curl -fs localhost:4182/api/deals | grep -q '"platform":"zepto"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:4182/api/subscriptions -H 'Content-Type: application/json' -d '{"subscription":{"endpoint":"https://evil.example/x","keys":{"p256dh":"a","auth":"b"}}}')" = 400
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (phone viewport)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bachat-playwright-report
          path: |
            bachat-offer-alerts/playwright-report
            bachat-offer-alerts/test-results
          retention-days: 7
      # Reads the real channels from GitHub's network. Informational: a source being
      # down shouldn't fail the build, but the log shows which ones still work.
      - name: Live source check
        continue-on-error: true
        run: npm run probe -- --show

  bachat-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bachat-offer-alerts/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug
      - name: Privacy check (permissions, exported components, tracker SDKs, endpoints)
        run: bash scripts/privacy-check.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bachat-debug-apk
          path: bachat-offer-alerts/android/app/build/outputs/apk/debug/app-debug.apk

  rail-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rail-planner/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rail-planner/backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  rail-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rail-planner/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rail-planner/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  rail-docker:
    runs-on: ubuntu-latest
    needs: [rail-backend, rail-frontend]
    defaults:
      run:
        working-directory: rail-planner
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rail-planner .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name app rail-planner
          for i in $(seq 1 20); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs "localhost:8000/api/routes?from=SBC&to=PUNE&date=2030-01-15" > /dev/null
          curl -fs localhost:8000/ | grep -q "<div id=\"root\">"
