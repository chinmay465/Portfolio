name: Kavach proxy e2e

# Boots an emulator and checks that proxy mode routes a proxy-unaware client
# through Kavach and an HTTP proxy, and blocks ad hosts.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "kavach-adblock/**"
      - ".github/workflows/kavach-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: kavach-adblock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache tunnel engine build
        uses: actions/cache@v4
        with:
          path: kavach-adblock/build/hev-ndk
          key: hev-ndk-${{ hashFiles('kavach-adblock/scripts/build-tunnel.sh') }}
      - run: bash scripts/build-tunnel.sh
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start test proxy on the host
        run: nohup python3 scripts/e2e/connect-proxy.py 3128 > /tmp/proxy.log 2>&1 &
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: kavach-adblock
          script: bash scripts/e2e/run.sh
