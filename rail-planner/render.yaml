# Render Blueprint: New > Blueprint > pick this repo. Redeploys on every push to main.
services:
  - type: web
    name: rail-planner
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: RAILRADAR_API_KEY # live timetable; without it the app falls back to the 2016-17 snapshot
        sync: false
