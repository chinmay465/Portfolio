# Render Blueprint: New > Blueprint > pick this repo. One static site per project folder; each redeploys on every push to main.
services:
  # Landing page for the whole repo. Render gives it chinmay-upare.onrender.com if the name is free.
  - type: web
    name: chinmay-upare
    runtime: static
    rootDir: portfolio-home
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # Client-side routes (/about, /projects/ekatra, ...): serve the app for any path that
    # isn't a real file, so deep links and refreshes work.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: ank-marathi-epapers
    runtime: static
    rootDir: ank-marathi-epapers
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
  - type: web
    name: ekatra-streaming-hub
    runtime: static
    rootDir: ekatra-streaming-hub
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
  # Shodh needs a server (paste sites can't be scraped from the browser), so it
  # runs as a Node web service rather than a static site.
  - type: web
    name: shodh-paste-monitor
    runtime: node
    rootDir: shodh-paste-monitor
    branch: main
    autoDeploy: true
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Lets the "Route through Setu" switch use the Setu service below. Public
      # URL on purpose: free services can't take private-network traffic. If
      # Render gives Setu a different subdomain, update this value.
      - key: SETU_URL
        value: https://setu-proxy-hub.onrender.com
      - key: SETU_TOKEN
        fromService:
          type: web
          name: setu-proxy-hub
          envVarKey: SETU_TOKEN
  # Setu: free-proxy pool + fetch/search API. On Render the relay only runs with
  # SETU_TOKEN (generated here), and the local VPN-like tunnel is off — run Setu
  # on your own machine for that.
  - type: web
    name: setu-proxy-hub
    runtime: node
    rootDir: setu-proxy-hub
    branch: main
    autoDeploy: true
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SETU_TOKEN
        generateValue: true
  # Darshak: unique-visitor counter for the portfolio site. portfolio-home sends one
  # beacon per browser session; this keeps one row per browser. Paste a Postgres URL
  # (Neon's free tier works) into DATABASE_URL when the Blueprint asks: without it the
  # counts live on the free instance's disk, which every deploy wipes. The dashboard at
  # the service URL is open (no token). Set STATS_TOKEN on the service to lock it.
  - type: web
    name: darshak-visitor-counter
    runtime: node
    rootDir: darshak-visitor-counter
    branch: main
    autoDeploy: true
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      # Sites allowed to send visits. Add the custom domain here once it's live.
      - key: ALLOWED_ORIGINS
        value: https://chinmay-upare.onrender.com
  # Rail Planner: FastAPI + React in one Docker image. Set RAILRADAR_API_KEY in the
  # dashboard when the Blueprint asks (it powers seat availability). rootDir keeps
  # deploys to changes under rail-planner/.
  - type: web
    name: chinmay-rail-planner
    runtime: docker
    rootDir: rail-planner
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: RAILRADAR_API_KEY
        sync: false
      - key: TIMETABLE_SOURCE # snapshot (stored timetable, no API calls for routes) or live
        value: snapshot
