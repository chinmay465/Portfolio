# Render Blueprint: New > Blueprint > pick this repo. Redeploys on every push to main.
services:
  - type: web
    name: ank-marathi-epapers
    runtime: static
    rootDir: ank-marathi-epapers
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
